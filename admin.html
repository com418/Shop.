<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxeStore Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#fff7fa;
  color:#351d28;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

:root{
  --pink:#e91e63;
  --light:#fff0f5;
  --dark:#351d28;
  --muted:#8b6f7a;
  --white:#fff;
  --border:#f2dce5;
  --green:#16834b;
  --red:#d9304f;
}

/* SVG */
svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* Layout */
.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:250px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:25px 18px;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:800;
  color:var(--pink);
  margin-bottom:35px;
}

.logo svg{
  width:30px;
  height:30px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px;
  border-radius:12px;
  background:transparent;
  color:#765563;
  text-align:left;
}

.nav button:hover,
.nav button.active{
  background:var(--light);
  color:var(--pink);
}

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  padding:25px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.topbar h1{
  font-size:28px;
}

.top-actions{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--border);
  display:grid;
  place-items:center;
}

.primary{
  background:var(--pink);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
}

.secondary{
  background:#fff;
  color:var(--dark);
  padding:12px 18px;
  border:1px solid var(--border);
  border-radius:12px;
}

/* Cards */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:var(--light);
  color:var(--pink);
  display:grid;
  place-items:center;
}

.stat p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:7px;
}

.stat h2{
  font-size:25px;
}

/* Sections */
.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:22px;
  overflow:hidden;
}

.section-head{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.section-head h2{
  font-size:19px;
}

/* Table */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:15px 20px;
  text-align:left;
  border-bottom:1px solid #f7e8ee;
}

th{
  color:#8b6f7a;
  font-size:13px;
}

td{
  font-size:14px;
}

.product-cell{
  display:flex;
  align-items:center;
  gap:12px;
}

.product-img{
  width:50px;
  height:50px;
  border-radius:12px;
  object-fit:cover;
  background:#fff0f5;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.badge-green{
  background:#e7f8ef;
  color:var(--green);
}

.badge-red{
  background:#ffe9ed;
  color:var(--red);
}

.actions{
  display:flex;
  gap:7px;
}

.small-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#fff0f5;
  color:var(--pink);
}

.small-btn.delete{
  color:var(--red);
  background:#fff0f2;
}

/* Empty */
.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
}

.empty svg{
  width:45px;
  height:45px;
  color:var(--pink);
  margin-bottom:10px;
}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(35,15,25,.55);
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:#fff;
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  font-size:22px;
}

.close{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff0f5;
  color:var(--pink);
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--pink);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.form-actions button{
  flex:1;
}

/* Loading */
.loading{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

/* Mobile */
.mobile-header{
  display:none;
}

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .mobile-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }

  .mobile-logo{
    font-weight:800;
    color:var(--pink);
    font-size:20px;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:16px;
    padding-bottom:90px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .topbar h1{
    font-size:23px;
  }

  .topbar .primary{
    padding:10px 13px;
  }

  .bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    padding:10px 5px;
    z-index:50;
  }

  .bottom-nav button{
    background:none;
    color:#8b6f7a;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10px;
  }

  .bottom-nav button.active{
    color:var(--pink);
  }

}

@media(min-width:901px){
  .bottom-nav{
    display:none;
  }
}
</style>
</head>

<!-- MAIN -->

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBLx6RK5sRIduaKiDSTAGlKPmfUH7iDSBM",
  authDomain: "shop-3d56c.firebaseapp.com",
  projectId: "shop-3d56c",
  storageBucket: "shop-3d56c.firebasestorage.app",
  messagingSenderId: "285039032126",
  appId: "1:285039032126:web:c2226d1aeb02a555c35e6f"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let editingId = null;


/* LOAD PRODUCTS */

async function loadProducts(){

  const container = document.getElementById("productsContainer");

  container.innerHTML = `
    <div class="loading">Loading products...</div>
  `;

  try{

    const snapshot = await getDocs(collection(db,"products"));

    document.getElementById("productCount").textContent =
      snapshot.size;

    if(snapshot.empty){

      container.innerHTML = `
        <div class="empty">
          <p>No products yet.</p>
          <p style="margin-top:5px;">
            Add your first product above ✨
          </p>
        </div>
      `;

      return;
    }

    let html = `
      <div class="table-wrap">
      <table>

      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
    `;

    snapshot.forEach(item=>{

      const p = item.data();

      const image = p.image ||
        "https://via.placeholder.com/100x100/fff0f5/e91e63?text=Luxe";

      html += `

        <tr>

          <td>

            <div class="product-cell">

              <img
                class="product-img"
                src="${escapeHtml(image)}"
                onerror="this.src='https://via.placeholder.com/100x100/fff0f5/e91e63?text=Luxe'"
              >

              <div>

                <strong>
                  ${escapeHtml(p.name || "Unnamed Product")}
                </strong>

                <div style="font-size:12px;color:#8b6f7a;margin-top:4px;">
                  ${escapeHtml(p.description || "")}
                </div>

              </div>

            </div>

          </td>

          <td>
            ${escapeHtml(p.category || "-")}
          </td>

          <td>
            ₦${Number(p.price || 0).toLocaleString()}
          </td>

          <td>

            <span class="badge badge-green">
              Active
            </span>

          </td>

          <td>

            <div class="actions">

              <button
                class="small-btn"
                onclick='editProduct("${item.id}", ${JSON.stringify(p).replace(/'/g,"&#39;")})'
              >
                ✎
              </button>

              <button
                class="small-btn delete"
                onclick="deleteProduct('${item.id}')"
              >
                ×
              </button>

            </div>

          </td>

        </tr>

      `;

    });

    html += `
      </tbody>
      </table>
      </div>
    `;

    container.innerHTML = html;

  }catch(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        <p style="color:#d9304f;">
          Could not load products.
        </p>

        <p style="margin-top:8px;font-size:13px;">
          ${escapeHtml(error.message)}
        </p>
      </div>
    `;

  }

}


/* SAVE PRODUCT */

document.getElementById("productForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const name =
    document.getElementById("productName").value.trim();

  const category =
    document.getElementById("productCategory").value;

  const price =
    Number(document.getElementById("productPrice").value);

  const image =
    document.getElementById("productImage").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();

  if(!name || !category || !price){

    alert("Please fill in the required fields.");

    return;
  }

  try{

    if(editingId){

      await updateDoc(
        doc(db,"products",editingId),
        {
          name,
          category,
          price,
          image,
          description,
          updatedAt:serverTimestamp()
        }
      );

      alert("Product updated successfully ✨");

    }else{

      await addDoc(
        collection(db,"products"),
        {
          name,
          category,
          price,
          image,
          description,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        }
      );

      alert("Product added successfully 🎉");

    }

    closeProductModal();

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Firebase error: " + error.message
    );

  }

});


/* DELETE */

window.deleteProduct = async function(id){

  const confirmed =
    confirm("Delete this product?");

  if(!confirmed) return;

  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    alert("Product deleted.");

    loadProducts();

  }catch(error){

    alert(
      "Could not delete product: " +
      error.message
    );

  }

};


/* EDIT */

window.editProduct = function(id,p){

  editingId = id;

  document.getElementById("modalTitle")
    .textContent = "Edit Product";

  document.getElementById("productName")
    .value = p.name || "";

  document.getElementById("productCategory")
    .value = p.category || "";

  document.getElementById("productPrice")
    .value = p.price || "";

  document.getElementById("productImage")
    .value = p.image || "";

  document.getElementById("productDescription")
    .value = p.description || "";

  openProductModal();

};


/* MODAL */

window.openProductModal = function(){

  document
    .getElementById("productModal")
    .classList.add("show");

};

window.closeProductModal = function(){

  document
    .getElementById("productModal")
    .classList.remove("show");

  editingId = null;

  document.getElementById("modalTitle")
    .textContent = "Add Product";

  document.getElementById("productForm")
    .reset();

};


/* NAVIGATION */

window.scrollToProducts = function(){

  document
    .getElementById("productsSection")
    .scrollIntoView({
      behavior:"smooth"
    });

};

window.scrollToOrders = function(){

  document
    .getElementById("ordersSection")
    .scrollIntoView({
      behavior:"smooth"

/* HTML SAFETY */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
