<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>LuxeStore Admin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --pink:#f29abb;
  --pink2:#ffdce8;
  --deep:#381524;
  --bg:#fff8f5;
  --card:#fff;
  --text:#2c2026;
  --muted:#8d7d84;
  --line:#f0dfe5;
  --danger:#dc5365;
  --shadow:0 15px 45px rgba(72,29,48,.10);
}

body{
  font-family:"DM Sans",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:white;
  border-right:1px solid var(--line);
  padding:24px 16px;
  z-index:100;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:27px;
  color:var(--deep);
  padding:0 12px 28px;
}

.logo span{
  color:var(--pink);
}

.side-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 14px;
  border:0;
  background:transparent;
  border-radius:13px;
  color:#806d75;
  margin-bottom:5px;
  text-align:left;
}

.side-link.active{
  background:var(--pink2);
  color:var(--deep);
  font-weight:700;
}

/* MAIN */

.main{
  margin-left:245px;
  min-height:100vh;
}

/* TOPBAR */

.topbar{
  height:75px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:90;
}

.top-title h1{
  font-family:"Playfair Display",serif;
  color:var(--deep);
  font-size:25px;
}

.top-title p{
  color:var(--muted);
  font-size:12px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.circle-btn{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:white;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--deep);
}

/* CONTENT */

.content{
  padding:28px;
  max-width:1500px;
  margin:auto;
}

.welcome{
  position:relative;
  overflow:hidden;
  padding:28px;
  border-radius:25px;
  background:linear-gradient(135deg,#ffe4ee,#fff1eb);
  margin-bottom:25px;
}

.welcome h2{
  font-family:"Playfair Display",serif;
  color:var(--deep);
  font-size:30px;
  margin-bottom:8px;
}

.welcome p{
  color:#80616e;
  font-size:14px;
}

.welcome-flower{
  position:absolute;
  right:35px;
  top:20px;
  width:90px;
  color:#c66c8d;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:19px;
  box-shadow:var(--shadow);
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.stat-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--pink2);
  color:var(--deep);
}

.stat-number{
  margin-top:14px;
  font-size:26px;
  font-weight:800;
  color:var(--deep);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

/* TOOLBAR */

.toolbar{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.search{
  flex:1;
  max-width:450px;
  position:relative;
}

.search input{
  width:100%;
  border:1px solid var(--line);
  background:#fffafa;
  padding:13px 15px 13px 43px;
  border-radius:14px;
  outline:none;
}

.search svg{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#a48691;
}

.add-product{
  border:0;
  background:var(--deep);
  color:white;
  padding:12px 18px;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:700;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.product-image{
  height:230px;
  position:relative;
  background:#f8e8ee;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stock{
  position:absolute;
  left:12px;
  top:12px;
  padding:7px 10px;
  border-radius:20px;
  background:white;
  color:var(--deep);
  font-size:11px;
  font-weight:800;
}

.stock.low{
  color:#bb4d5d;
}

.stock.out{
  background:#5e5055;
  color:white;
}

.product-body{
  padding:15px;
}

.product-category{
  color:#b65f80;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.product-name{
  margin-top:6px;
  color:var(--deep);
  font-weight:800;
}

.product-price{
  margin-top:7px;
  font-weight:800;
  color:#49313b;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.action{
  flex:1;
  height:40px;
  border:1px solid var(--line);
  background:white;
  border-radius:11px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  color:var(--deep);
}

.action.delete{
  color:var(--danger);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

/* FLOATING ADMIN */

.floating-add{
  position:fixed;
  right:20px;
  bottom:25px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--deep);
  color:white;
  display:grid;
  place-items:center;
  box-shadow:0 15px 35px rgba(56,21,36,.28);
  z-index:200;
}

.floating-status{
  position:fixed;
  right:20px;
  bottom:95px;
  padding:9px 13px;
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  font-size:11px;
  font-weight:700;
  color:var(--deep);
  z-index:190;
}

.floating-spark{
  position:fixed;
  pointer-events:none;
  color:#e9a0b8;
  opacity:.45;
}

.spark1{
  left:270px;
  top:130px;
}

.spark2{
  right:40px;
  top:180px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(37,19,27,.48);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:500;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(600px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:25px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  font-family:"Playfair Display",serif;
  color:var(--deep);
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--line);
  background:white;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#6f5962;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none;
  background:#fffafa;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.image-picker{
  border:2px dashed #e7c5d2;
  border-radius:17px;
  padding:20px;
  text-align:center;
  background:#fff8fb;
}

.image-picker input{
  display:none;
}

.upload-btn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:11px 15px;
  border-radius:12px;
  background:var(--pink2);
  color:var(--deep);
  font-weight:700;
}

.preview{
  margin-top:12px;
  display:none;
}

.preview img{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:14px;
}

.save{
  width:100%;
  border:0;
  background:var(--deep);
  color:white;
  padding:15px;
  border-radius:14px;
  font-weight:800;
  margin-top:5px;
}

/* MOBILE */

.mobile-nav{
  display:none;
}

@media(max-width:1050px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:750px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding-bottom:75px;
  }

  .topbar{
    padding:0 16px;
  }

  .content{
    padding:18px 14px;
  }

  .top-title h1{
    font-size:21px;
  }

  .welcome{
    padding:23px;
  }

  .welcome h2{
    font-size:26px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .stat{
    padding:14px;
  }

  .toolbar{
    flex-direction:column;
  }

  .search{
    max-width:none;
  }

  .add-product{
    justify-content:center;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:11px;
  }

  .product-image{
    height:185px;
  }

  .product-body{
    padding:12px;
  }

  .actions{
    flex-direction:column;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:65px;
    background:white;
    border-top:1px solid var(--line);
    z-index:300;
    justify-content:space-around;
    align-items:center;
  }

  .mobile-nav button{
    border:0;
    background:none;
    color:#9b818c;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10px;
  }

  .mobile-nav button:first-child{
    color:var(--deep);
    font-weight:800;
  }

}

@media(max-width:450px){

  .row{
    grid-template-columns:1fr;
  }

  .product-image{
    height:170px;
  }

  .product-name{
    font-size:14px;
  }

}
</style>
</head>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLx6RK5sRIduaKiDSTAGlKPmfUH7iDSBM",
  authDomain: "shop-3d56c.firebaseapp.com",
  projectId: "shop-3d56c",
  storageBucket: "shop-3d56c.firebasestorage.app",
  messagingSenderId: "285039032126",
  appId: "1:285039032126:web:c2226d1aeb02a555c35e6f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [];
let selectedImage = "";

function money(value){
  return "₦" + Number(value || 0).toLocaleString();
}

window.loadProducts = async function(){

  try{

    const snapshot = await getDocs(
      collection(db,"products")
    );

    allProducts = snapshot.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    renderProducts();
    updateStats();

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML = `
      <div class="empty">
        Could not load products.<br><br>
        ${error.message}
      </div>
    `;

  }

};

window.renderProducts = function(){

  const container = document.getElementById("products");

  const search =
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  const list = allProducts.filter(p => {

    return (
      String(p.name || "").toLowerCase().includes(search) ||
      String(p.category || "").toLowerCase().includes(search)
    );

  });

  if(!list.length){

    container.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(p => {

    const stock = Number(p.stock || 0);

    let stockClass = "";

    if(stock <= 3 && stock > 0){
      stockClass = "low";
    }

    if(stock <= 0){
      stockClass = "out";
    }

    return `
      <article class="product">

        <div class="product-image">

          <img
            src="${p.image || 'https://placehold.co/600x700/f8e8ee/6c4657?text=LuxeStore'}"
            alt=""
          >

          <div class="stock ${stockClass}">
            ${stock <= 0 ? "Sold out" : `${stock} left`}
          </div>

        </div>

        <div class="product-body">

          <div class="product-category">
            ${escapeHtml(p.category || "Collection")}
          </div>

          <div class="product-name">
            ${escapeHtml(p.name || "Untitled")}
          </div>

          <div class="product-price">
            ${money(p.price)}
          </div>

          <div class="actions">

            <button
              class="action"
              onclick="editProduct('${p.id}')"
            >

              <svg viewBox="0 0 24 24">
                <path d="M4 20h4L19 9l-4-4L4 16z"></path>
                <path d="m13 6 4 4"></path>
              </svg>

              Edit

            </button>

            <button
              class="action delete"
              onclick="deleteProduct('${p.id}')"
            >

              <svg viewBox="0 0 24 24">
                <path d="M4 7h16"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M6 7l1 14h10l1-14"></path>
                <path d="M9 7V4h6v3"></path>
              </svg>

              Delete

            </button>

          </div>

        </div>

      </article>
    `;

  }).join("");

};

function updateStats(){

  const totalProducts = allProducts.length;

  const totalStock = allProducts.reduce(
    (sum,p) => sum + Number(p.stock || 0),
    0
  );

  const stockValue = allProducts.reduce(
    (sum,p) =>
      sum +
      Number(p.stock || 0) *
      Number(p.price || 0),
    0
  );

  const categories = new Set(
    allProducts.map(p => p.category)
  ).size;

  document.getElementById("totalProducts").textContent =
    totalProducts;

  document.getElementById("totalStock").textContent =
    totalStock.toLocaleString();

  document.getElementById("stockValue").textContent =
    money(stockValue);

  document.getElementById("categories").textContent =
    categories;

}

window.openAdd = function(){

  document.getElementById("modalTitle").textContent =
    "Add Product";

  document.getElementById("productId").value = "";

  document.getElementById("name").value = "";

  document.getElementById("category").value = "Clothing";

  document.getElementById("price").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("description").value = "";

  selectedImage = "";

  document.getElementById("imageInput").value = "";

  document.getElementById("preview").style.display = "none";

  document.getElementById("modal").classList.add("show");

};

window.closeModal = function(){

  document.getElementById("modal").classList.remove("show");

};

window.previewImage = function(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    document.getElementById("previewImg").src =
      selectedImage;

    document.getElementById("preview").style.display =
      "block";

  };

  reader.readAsDataURL(file);

};

window.saveProduct = async function(){

  const id =
    document.getElementById("productId").value;

  const name =
    document.getElementById("name").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    Number(document.getElementById("price").value);

  const stock =
    Number(document.getElementById("stock").value);

  const description =
    document.getElementById("description").value.trim();

  if(!name){
    alert("Please enter a product name.");
    return;
  }

  if(!price || price < 0){
    alert("Please enter a valid price.");
    return;
  }

  if(stock < 0 || Number.isNaN(stock)){
    alert("Please enter a valid stock quantity.");
    return;
  }

  const data = {

    name,
    category,
    price,
    stock,
    description,

    updatedAt:serverTimestamp()

  };

  if(selectedImage){
    data.image = selectedImage;
  }

  try{

    if(id){

      await updateDoc(
        doc(db,"products",id),
        data
      );

      alert("Product updated successfully ✨");

    }else{

      data.createdAt = serverTimestamp();

      await addDoc(
        collection(db,"products"),
        data
      );

      alert("Product added successfully 🎉");

    }

    closeModal();

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Could not save product.\n\n" +
      error.message
    );

  }

};

window.editProduct = function(id){

  const product =
    allProducts.find(p => p.id === id);

  if(!product){
    alert("Product not found.");
    return;
  }

  document.getElementById("modalTitle").textContent =
    "Edit Product";

  document.getElementById("productId").value =
    product.id;

  document.getElementById("name").value =
    product.name || "";

  document.getElementById("category").value =
    product.category || "Clothing";

  document.getElementById("price").value =
    product.price || "";

  document.getElementById("stock").value =
    product.stock ?? 0;

  document.getElementById("description").value =
    product.description || "";

  selectedImage = product.image || "";

  if(product.image){

    document.getElementById("previewImg").src =
      product.image;

    document.getElementById("preview").style.display =
      "block";

  }else{

    document.getElementById("preview").style.display =
      "none";

  }

  document.getElementById("modal").classList.add("show");

};

window.deleteProduct = async function(id){

  const product =
    allProducts.find(p => p.id === id);

  if(!product){

    alert("Product not found.");

    return;

  }

  const confirmed = confirm(
    `Are you sure you want to delete "${product.name}"?\n\nThis cannot be undone.`
  );

  if(!confirmed) return;

  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    alert("Product deleted successfully! 🗑️");

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Could not delete product.\n\n" +
      error.message
    );

  }

};

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

loadProducts();

</script>
