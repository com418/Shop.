<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#fff4f8">
<title>LuxeStore — Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --pink:#e83e8c;
  --pink2:#ff6fae;
  --dark:#21151c;
  --muted:#8b7c84;
  --bg:#fff7fa;
  --card:#fff;
  --border:#f1dce6;
  --green:#16a36a;
  --red:#e53935;
  --orange:#f59e0b;
  --shadow:0 15px 40px rgba(232,62,140,.10);
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,rgba(255,111,174,.20),transparent 35%),
    radial-gradient(circle at bottom right,rgba(232,62,140,.12),transparent 35%),
    var(--bg);
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  border:1px solid var(--border);
  border-radius:30px;
  padding:30px 22px;
  box-shadow:var(--shadow);
}

.logo{
  width:65px;
  height:65px;
  border-radius:22px;
  display:grid;
  place-items:center;
  margin:0 auto 15px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;
  box-shadow:0 12px 25px rgba(232,62,140,.25);
}

.logo svg{
  width:34px;
  height:34px;
}

.login-card h1{
  text-align:center;
  font-size:27px;
  margin-bottom:7px;
}

.login-card p{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px 14px;
  outline:none;
  background:#fff;
  color:var(--dark);
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 4px rgba(232,62,140,.08);
}

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;
  font-weight:800;
  box-shadow:0 10px 20px rgba(232,62,140,.18);
}

.primary-btn:disabled{
  opacity:.6;
}

.error{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#fff0f0;
  color:#c62828;
  font-size:13px;
  display:none;
}

/* APP */

#app{
  display:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;
}

.brand-icon svg{
  width:23px;
}

.brand strong{
  display:block;
  font-size:17px;
}

.brand span{
  color:var(--muted);
  font-size:11px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#fff3f7;
  color:var(--pink);
  display:grid;
  place-items:center;
}

.icon-btn svg{
  width:20px;
}

.container{
  width:min(1200px,calc(100% - 28px));
  margin:22px auto 100px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:22px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#fff0f6;
  color:var(--pink);
  display:grid;
  place-items:center;
  margin-bottom:12px;
}

.stat-icon svg{
  width:20px;
}

.stat small{
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

.stat strong{
  font-size:23px;
}

/* SECTION */

.section{
  background:white;
  border:1px solid var(--border);
  border-radius:23px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.section-head h2{
  font-size:19px;
}

.add-btn{
  background:var(--pink);
  color:white;
  padding:11px 15px;
  border-radius:13px;
  font-weight:800;
}

/* SEARCH */

.search{
  margin-bottom:15px;
}

.search input{
  width:100%;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  outline:none;
}

/* PRODUCTS */

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.product{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  background:white;
}

.product-img{
  width:100%;
  aspect-ratio:1/1;
  background:#fff2f7;
  object-fit:cover;
}

.product-body{
  padding:13px;
}

.product-body h3{
  font-size:15px;
  margin-bottom:5px;
}

.product-category{
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.product-price{
  font-weight:900;
  color:var(--pink);
  margin-bottom:7px;
}

.stock{
  font-size:12px;
  margin-bottom:10px;
  font-weight:700;
}

.stock.low{
  color:var(--orange);
}

.stock.out{
  color:var(--red);
}

.product-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  flex:1;
  padding:9px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.edit{
  background:#fff0f6;
  color:var(--pink);
}

.delete{
  background:#fff0f0;
  color:var(--red);
}

/* ORDERS */

.order{
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.order-id{
  font-size:12px;
  color:var(--muted);
  word-break:break-all;
}

.status{
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  text-transform:capitalize;
}

.status.pending{
  background:#fff6df;
  color:#a66a00;
}

.status.confirmed{
  background:#eafaf2;
  color:#128456;
}

.status.delivered{
  background:#e9f3ff;
  color:#1769aa;
}

.status.cancelled{
  background:#fff0f0;
  color:#c62828;
}

.order-customer{
  font-size:14px;
  line-height:1.6;
}

.order-items{
  margin:12px 0;
  padding:10px;
  background:#fff8fb;
  border-radius:13px;
  font-size:13px;
}

.order-total{
  font-size:18px;
  font-weight:900;
  color:var(--pink);
  margin-bottom:10px;
}

.order-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.order-actions button{
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
}

.confirm{
  background:#eafaf2;
  color:#128456;
}

.deliver{
  background:#e9f3ff;
  color:#1769aa;
}

.cancel{
  background:#fff0f0;
  color:#c62828;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(20,10,15,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(600px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:28px 28px 0 0;
  padding:20px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h2{
  font-size:20px;
}

.close{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#fff0f6;
  color:var(--pink);
  font-size:20px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:15px;
  margin-top:8px;
  display:none;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  background:#21151c;
  color:white;
  padding:12px 17px;
  border-radius:14px;
  font-size:13px;
  z-index:200;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .container{
    width:min(100% - 20px,1200px);
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat strong{
    font-size:19px;
  }

  .product-grid{
    gap:9px;
  }

  .section{
    padding:13px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-card">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M6 8h12l1 13H5L6 8Z"/>

<!-- ADMIN APP -->

<div id="app">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 8h12l1 13H5L6 8Z"/>
            <path d="M9 8a3 3 0 0 1 6 0"/>
          </svg>
        </div>

        <div>
          <strong>LuxeStore</strong>
          <span>Admin Dashboard</span>
        </div>

      </div>

      <div class="top-actions">

        <button class="icon-btn" id="notificationBtn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>

          </svg>

  <main class="container">

    <div class="stats">

        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 8h12l1 13H5L6 8Z"/>
            <path d="M9 8a3 3 0 0 1 6 0"/>
          </svg>
        </div>
        <small>Products</small>
        <strong id="productsCount">0</strong>
      </div>

      <div class="stat">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3v18M17 7.5c0-2-2-3.5-5-3.5S7 5.5 7 7.5 9 11 12 11s5 1.5 5 3.5-2 3.5-5 3.5-5-1.5-5-3.5"/>

    <!-- PRODUCTS -->

    <section class="section">

<!-- PRODUCT MODAL -->

<div class="modal" id="productModal">

  <div class="modal-card">

    <div class="modal-head">
      <h2 id="modalTitle">Add Product</h2>
      <button class="close" id="closeModal">×</button>

<div id="toast"></div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBLx6RK5sRIduaKiDSTAGlKPmfUH7iDSBM",
  authDomain: "shop-3d56c.firebaseapp.com",
  databaseURL: "https://shop-3d56c-default-rtdb.firebaseio.com",
  projectId: "shop-3d56c",
  storageBucket: "shop-3d56c.firebasestorage.app",
  messagingSenderId: "285039032126",
  appId: "1:285039032126:web:c2226d1aeb02a555c35e6f"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("app");

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

const logoutBtn = document.getElementById("logoutBtn");

const productGrid = document.getElementById("productGrid");
const ordersList = document.getElementById("ordersList");

const productSearch = document.getElementById("productSearch");

const productModal = document.getElementById("productModal");
const productForm = document.getElementById("productForm");

const addProductBtn = document.getElementById("addProductBtn");
const closeModal = document.getElementById("closeModal");

const productId = document.getElementById("productId");
const productName = document.getElementById("productName");
const productCategory = document.getElementById("productCategory");
const productPrice = document.getElementById("productPrice");
const productStock = document.getElementById("productStock");
const productDescription = document.getElementById("productDescription");
const productImageFile = document.getElementById("productImageFile");
const imagePreview = document.getElementById("imagePreview");

const productsCount = document.getElementById("productsCount");
const stockCount = document.getElementById("stockCount");
const ordersCount = document.getElementById("ordersCount");
const salesCount = document.getElementById("salesCount");


/* =========================================================
   STATE
========================================================= */

let currentAdmin = null;
let products = [];
let orders = [];
let editingImage = "";


/* =========================================================
   HELPERS
========================================================= */

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2800);
}


function money(value){

  return "₦" + Number(value || 0).toLocaleString("en-NG");
}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showLoginError(message){

  loginError.textContent = message;
  loginError.style.display = "block";
}


function hideLoginError(){

  loginError.textContent = "";
  loginError.style.display = "none";
}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  hideLoginError();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){

    showLoginError("Enter your email and password.");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";

  try{

    const credential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = credential.user;

    /*
      IMPORTANT:
      Read the exact admin document directly:
      admins/{UID}
    */

    const adminRef = doc(db,"admins",user.uid);

    const adminSnap = await getDoc(adminRef);

    if(!adminSnap.exists()){

      await signOut(auth);

      showLoginError(
        "This account is not registered as an admin."
      );

      return;
    }

    const adminData = adminSnap.data();

    if(
      adminData.role !== "admin" ||
      adminData.active !== true
    ){

      await signOut(auth);

      showLoginError(
        "Your admin account is inactive or does not have admin access."
      );

      return;
    }

    currentAdmin = user;

    loginScreen.style.display = "none";
    appScreen.style.display = "block";

    toast("Welcome to LuxeStore Admin 👑");

    startRealtimeListeners();

  }catch(error){

    console.error(error);

    let message = "Unable to sign in.";

    if(
      error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found"
    ){

      message = "Incorrect email or password.";

    }else if(error.code === "auth/too-many-requests"){

      message = "Too many attempts. Please wait a little and try again.";

    }else if(error.code === "permission-denied"){

      message =
        "Firebase permission denied. We need to update your Firestore rules.";

    }else if(error.message){

      message = error.message;
    }

    showLoginError(message);

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
  }

});


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth,async(user)=>{

  if(!user){

    currentAdmin = null;

    loginScreen.style.display = "flex";
    appScreen.style.display = "none";

    return;
  }

  /*
    If already signed in, verify the admin document.
  */

  try{

    const adminRef = doc(db,"admins",user.uid);

    const adminSnap = await getDoc(adminRef);

    if(
      adminSnap.exists() &&
      adminSnap.data().role === "admin" &&
      adminSnap.data().active === true
    ){

      currentAdmin = user;

      loginScreen.style.display = "none";
      appScreen.style.display = "block";

      startRealtimeListeners();

    }else{

      await signOut(auth);

    }

  }catch(error){

    console.error("Admin verification error:",error);

  }

});


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click",async()=>{

  await signOut(auth);

  toast("Logged out.");

});


/* =========================================================
   REALTIME DATA
========================================================= */

let listenersStarted = false;

function startRealtimeListeners(){

  if(listenersStarted) return;

  listenersStarted = true;


  /* PRODUCTS */

  onSnapshot(
    collection(db,"products"),
    snapshot=>{

      products = snapshot.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      renderProducts();

      updateStats();

    },
    error=>{

      console.error(error);

      toast("Could not load products.");

    }
  );


  /* ORDERS */

  const ordersQuery = query(
    collection(db,"orders"),
    orderBy("createdAt","desc")
  );

  onSnapshot(
    ordersQuery,
    snapshot=>{

      orders = snapshot.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      renderOrders();

      updateStats();

    },
    error=>{

      console.error(error);

      /*
        If the index does not exist yet, Firebase may report it.
      */

      toast("Could not load orders. Check Firestore indexes/rules.");

    }
  );

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

  productsCount.textContent = products.length;

  const stock = products.reduce(
    (sum,p)=>sum + Number(p.stock || 0),
    0
  );

  stockCount.textContent = stock;

  ordersCount.textContent = orders.length;

  const sales = orders
    .filter(o =>
      o.status === "confirmed" ||
      o.status === "delivered"
    )
    .reduce(
      (sum,o)=>sum + Number(o.total || 0),
      0
    );

  salesCount.textContent = money(sales);

}


/* =========================================================
   PRODUCTS
========================================================= */

function renderProducts(){

  const search = productSearch.value.trim().toLowerCase();

  const filtered = products.filter(p=>{

    return String(p.name || "")
      .toLowerCase()
      .includes(search);

  });


  if(filtered.length === 0){

    productGrid.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;
  }


  productGrid.innerHTML = filtered.map(p=>{

    const stock = Number(p.stock || 0);

    let stockClass = "";

    if(stock <= 0){
      stockClass = "out";
    }else if(stock <= 3){
      stockClass = "low";
    }

    return `
      <article class="product">

        ${
          p.image
          ?
          `<img class="product-img"
                src="${p.image}"
                alt="${escapeHTML(p.name)}">`
          :
          `<div class="product-img"></div>`
        }

        <div class="product-body">

          <h3>${escapeHTML(p.name)}</h3>

          <div class="product-category">
            ${escapeHTML(p.category || "Product")}
          </div>

          <div class="product-price">
            ${money(p.price)}
          </div>

          <div class="stock ${stockClass}">
            ${
              stock <= 0
              ? "Sold out"
              : `${stock} in stock`
            }
          </div>

          <div class="product-actions">

            <button
              class="small-btn edit"
              onclick="editProduct('${p.id}')">
              Edit
            </button>

            <button
              class="small-btn delete"
              onclick="removeProduct('${p.id}')">
              Delete
            </button>

          </div>

        </div>

      </article>
    `;

  }).join("");

}


productSearch.addEventListener("input",renderProducts);


/* =========================================================
   ADD PRODUCT
========================================================= */

addProductBtn.addEventListener("click",()=>{

  productForm.reset();

  productId.value = "";

  editingImage = "";

  imagePreview.src = "";
  imagePreview.style.display = "none";

  document.getElementById("modalTitle").textContent =
    "Add Product";

  productModal.classList.add("show");

});


/* =========================================================
   EDIT PRODUCT
========================================================= */

window.editProduct = function(id){

  const product = products.find(p=>p.id === id);

  if(!product) return;

  productId.value = product.id;

  productName.value = product.name || "";
  productCategory.value = product.category || "Clothing";
  productPrice.value = product.price || 0;
  productStock.value = product.stock || 0;
  productDescription.value = product.description || "";

  editingImage = product.image || "";

  if(editingImage){

    imagePreview.src = editingImage;
    imagePreview.style.display = "block";

  }else{

    imagePreview.src = "";
    imagePreview.style.display = "none";

  }

  document.getElementById("modalTitle").textContent =
    "Edit Product";

  productModal.classList.add("show");

};


/* =========================================================
   IMAGE
========================================================= */

productImageFile.addEventListener("change",()=>{

  const file = productImageFile.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = ()=>{

    editingImage = reader.result;

    imagePreview.src = reader.result;
    imagePreview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* =========================================================
   SAVE PRODUCT
========================================================= */

productForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  if(!currentAdmin){

    toast("Admin session expired.");

    return;
  }

  const id = productId.value.trim();

  const data = {

    name:productName.value.trim(),

    category:productCategory.value,

    price:Number(productPrice.value || 0),

    stock:Number(productStock.value || 0),

    image:editingImage || "",

    description:productDescription.value.trim(),

    updatedAt:serverTimestamp()

  };


  const button = document.getElementById("saveProductBtn");

  button.disabled = true;
  button.textContent = "Saving...";


  try{

    if(id){

      await updateDoc(
        doc(db,"products",id),
        data
      );

      toast("Product updated ✅");

    }else{

      await addDoc(
        collection(db,"products"),
        {
          ...data,
          createdAt:serverTimestamp()
        }
      );

      toast("Product added ✅");

    }

    productModal.classList.remove("show");

    productForm.reset();

    editingImage = "";

    imagePreview.src = "";
    imagePreview.style.display = "none";

  }catch(error){

    console.error(error);

    toast(
      "Could not save product: " +
      error.message
    );

  }finally{

    button.disabled = false;
    button.textContent = "Save Product";

  }

});


/* =========================================================
   DELETE PRODUCT
========================================================= */

window.removeProduct = async function(id){

  const product = products.find(p=>p.id === id);

  if(!product) return;

  if(!confirm(
    `Delete "${product.name}"?`
  )) return;


  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    toast("Product deleted.");

  }catch(error){

    console.error(error);

    toast(
      "Could not delete product: " +
      error.message
    );

  }

};


/* =========================================================
   ORDERS
========================================================= */

function renderOrders(){

  if(orders.length === 0){

    ordersList.innerHTML = `
      <div class="empty">
        No customer orders yet 🛍️
      </div>
    `;

    return;
  }


  ordersList.innerHTML = orders.map(order=>{

    const customer = order.customer || {};

    const items = Array.isArray(order.items)
      ? order.items
      : [];


    const itemsHTML = items.map(item=>{

      return `
        <div>
          ${escapeHTML(item.name || "Product")}
          × ${Number(item.quantity || 0)}
          — ${money(
            Number(item.price || 0) *
            Number(item.quantity || 0)
          )}
        </div>
      `;

    }).join("");


    let date = "";

    if(order.createdAt?.toDate){

      date = order.createdAt
        .toDate()
        .toLocaleString("en-NG");

    }


    return `
      <article class="order">

        <div class="order-top">

          <div>
            <strong>
              Order #${escapeHTML(order.id.slice(-8))}
            </strong>

            <div class="order-id">
              ${escapeHTML(date)}
            </div>
          </div>

          <span class="status ${escapeHTML(order.status || "pending")}">
            ${escapeHTML(order.status || "pending")}
          </span>

        </div>


        <div class="order-customer">

          <strong>
            ${escapeHTML(customer.name || "Customer")}
          </strong>

          <br>

          ${escapeHTML(customer.phone || "")}

          <br>

          ${escapeHTML(customer.address || "")}

          ${
            customer.note
            ?
            `<br>Note: ${escapeHTML(customer.note)}`
            :
            ""
          }

        </div>


        <div class="order-items">
          ${itemsHTML || "No items"}
        </div>


        <div class="order-total">
          ${money(order.total)}
        </div>


        <div class="order-actions">

          ${
            order.status === "pending"
            ?
            `
            <button
              class="confirm"
              onclick="changeOrderStatus('${order.id}','confirmed')">
              ✓ Confirm Order
            </button>

            <button
              class="cancel"
              onclick="changeOrderStatus('${order.id}','cancelled')">
              Cancel
            </button>
            `
            :
            ""
          }


          ${
            order.status === "confirmed"
            ?
            `
            <button
              class="deliver"
              onclick="changeOrderStatus('${order.id}','delivered')">
              ✓ Mark Delivered
            </button>

            <button
              class="cancel"
              onclick="changeOrderStatus('${order.id}','cancelled')">
              Cancel
            </button>
            `
            :
            ""
          }

        </div>

      </article>
    `;

  }).join("");

}


/* =========================================================
   CHANGE ORDER STATUS
========================================================= */

window.changeOrderStatus = async function(
  orderId,
  newStatus
){

  const order = orders.find(o=>o.id === orderId);

  if(!order) return;


  if(
    newStatus === "cancelled" &&
    !confirm("Cancel this order and restore the stock?")
  ){

    return;
  }


  try{

    const orderRef = doc(
      db,
      "orders",
      orderId
    );


    await runTransaction(
      db,
      async(transaction)=>{

        const orderSnap =
          await transaction.get(orderRef);

        if(!orderSnap.exists()){

          throw new Error("Order no longer exists.");

        }


        const currentOrder = orderSnap.data();

        /*
          Only restore stock once.
        */

        if(
          newStatus === "cancelled" &&
          currentOrder.status !== "cancelled" &&
          currentOrder.stockReserved === true
        ){

          const items =
            Array.isArray(currentOrder.items)
            ? currentOrder.items
            : [];


          for(const item of items){

            if(!item.productId) continue;

            const productRef =
              doc(db,"products",item.productId);

            const productSnap =
              await transaction.get(productRef);

            if(productSnap.exists()){

              const product =
                productSnap.data();

              const currentStock =
                Number(product.stock || 0);

              const quantity =
                Number(item.quantity || 0);

              transaction.update(
                productRef,
                {
                  stock:
                    currentStock + quantity,

                  updatedAt:
                    serverTimestamp()
                }
              );

            }

          }


          transaction.update(
            orderRef,
            {
              status:"cancelled",

              stockReserved:false,

              updatedAt:
                serverTimestamp()
            }
          );

        }else{

          transaction.update(
            orderRef,
            {
              status:newStatus,

              updatedAt:
                serverTimestamp()
            }
          );

        }

      }
    );


    toast(
      newStatus === "confirmed"
      ? "Order confirmed ✅"
      : newStatus === "delivered"
      ? "Order marked as delivered ✅"
      : "Order cancelled and stock restored."
    );


  }catch(error){

    console.error(error);

    toast(
      "Could not update order: " +
      error.message
    );

  }

};

closeModal.addEventListener("click",()=>{

  productModal.classList.remove("show");

});


productModal.addEventListener("click",(e)=>{

  if(e.target === productModal){

    productModal.classList.remove("show");

  }

});
