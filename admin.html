<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#fff4f8">
<title>LuxeStore Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --pink:#e83e8c;
  --pink2:#ff72b6;
  --dark:#251d22;
  --muted:#82747c;
  --bg:#fff8fb;
  --card:#fff;
  --line:#f0dfe7;
  --green:#198754;
  --red:#dc3545;
  --orange:#d97706;
  --shadow:0 15px 40px rgba(60,20,45,.08);
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--dark);
}

button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}

.hidden{display:none!important}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 10%,#ffd5e8,transparent 30%),
    #fff8fb;
}

.loginBox{
  width:100%;
  max-width:430px;
  background:white;
  border:1px solid var(--line);
  border-radius:28px;
  padding:28px;
  box-shadow:var(--shadow);
}

.logo{
  font-size:30px;
  font-weight:900;
  text-align:center;
  margin-bottom:7px;
}

.logo span{color:var(--pink)}

.loginBox p{
  color:var(--muted);
  text-align:center;
  margin-bottom:23px;
}

.form{
  display:grid;
  gap:12px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  outline:none;
  background:white;
}

.form input:focus,
.form textarea:focus,
.form select:focus{
  border-color:var(--pink);
}

.primary{
  background:var(--pink);
  color:white;
  padding:14px;
  border-radius:13px;
  font-weight:900;
}

.secondary{
  background:#f8edf2;
  color:var(--dark);
  padding:12px;
  border-radius:12px;
  font-weight:800;
}

.danger{
  background:#f8d7da;
  color:#842029;
  padding:10px 12px;
  border-radius:10px;
  font-weight:800;
}

.app{
  display:none;
}

.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.topInner{
  max-width:1250px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.topTitle{
  font-size:21px;
  font-weight:900;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff0f6;
  color:var(--pink);
}

.main{
  max-width:1250px;
  margin:auto;
  padding:20px 18px 100px;
}

.welcome{
  padding:24px;
  border-radius:25px;
  background:linear-gradient(135deg,#ffe1ee,#fff8fb);
  border:1px solid var(--line);
  margin-bottom:18px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:7px;
}

.welcome p{
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  box-shadow:var(--shadow);
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.panelHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.panelHead h2{
  font-size:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}

.product img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#f8edf2;
}

.productBody{
  padding:12px;
}

.productName{
  font-weight:900;
}

.productMeta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.productPrice{
  color:var(--pink);
  font-weight:900;
  margin-top:6px;
}

.productButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.order{
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.orderHeader{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.status{
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  text-transform:capitalize;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.confirmed{
  background:#d1e7dd;
  color:#0f5132;
}

.delivered{
  background:#cfe2ff;
  color:#084298;
}

.cancelled{
  background:#f8d7da;
  color:#842029;
}

.customer{
  margin-top:12px;
  padding:12px;
  border-radius:13px;
  background:#fff8fb;
}

.customer div{
  margin-top:4px;
  font-size:13px;
}

.orderItems{
  margin-top:12px;
}

.orderItem{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.orderTotal{
  text-align:right;
  font-size:18px;
  font-weight:900;
  margin-top:12px;
}

.orderActions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.orderActions button{
  padding:10px 12px;
  border-radius:10px;
  font-weight:800;
}

.confirm{
  background:#d1e7dd;
  color:#0f5132;
}

.deliver{
  background:#cfe2ff;
  color:#084298;
}

.cancel{
  background:#f8d7da;
  color:#842029;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:13px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(20,10,15,.5);
  z-index:90;
  display:none;
}

.overlay.show{display:block}

.modal{
  position:fixed;
  z-index:100;
  left:50%;
  top:50%;
  width:calc(100% - 30px);
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  transform:translate(-50%,-45%);
  background:white;
  border-radius:25px;
  padding:20px;
  display:none;
}

.modal.show{display:block}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f8edf2;
}

.preview{
  width:100%;
  max-height:230px;
  object-fit:cover;
  border-radius:15px;
  margin-top:8px;
  display:none;
}

.bottomAdd{
  position:fixed;
  right:20px;
  bottom:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--pink);
  color:white;
  font-size:30px;
  box-shadow:0 12px 30px rgba(232,62,140,.3);
  z-index:50;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.notice{
  position:fixed;
  top:18px;
  left:15px;
  right:15px;
  z-index:200;
  background:#251d22;
  color:white;
  padding:14px;
  border-radius:14px;
  display:none;
}

.notice.show{display:block}
.notice.success{background:#198754}
.notice.error{background:#dc3545}

@media(min-width:700px){
  .stats{
    grid-template-columns:repeat(4,1fr);
  }

  .products{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div id="notice" class="notice"></div>

<!-- ADMIN LOGIN -->
<section id="loginScreen" class="login">

  <div class="loginBox">

    <div class="logo">
      Luxe<span>Store</span>
    </div>

    <p>Admin Dashboard</p>

    <form id="loginForm" class="form">

      <input
        id="adminEmail"
        type="email"
        placeholder="Admin email"
        required
      >

      <input
        id="adminPassword"
        type="password"
        placeholder="Password"
        required
      >

      <button class="primary">
        Login to Dashboard
      </button>

    </form>

  </div>

</section>

<!-- ADMIN APP -->
<section id="adminApp" class="app">

  <header class="top">

    <div class="topInner">

      <div class="topTitle">
        LuxeStore Admin
      </div>

      <div class="topActions">

        <button
          class="iconBtn"
          onclick="enableNotifications()"
          title="Notifications">
          🔔
        </button>

        <button
          class="iconBtn"
          onclick="logoutAdmin()"
          title="Logout">
          ↪
        </button>

      </div>

    </div>

  </header>

  <main class="main">

    <div class="welcome">
      <h1>Welcome back 👋</h1>
      <p>Manage your LuxeStore products and customer orders.</p>
    </div>

    <section class="stats">

      <div class="stat">
        <small>Products</small>
        <strong id="statProducts">0</strong>
      </div>

      <div class="stat">
        <small>Total Stock</small>
        <strong id="statStock">0</strong>
      </div>

      <div class="stat">
        <small>Orders</small>
        <strong id="statOrders">0</strong>
      </div>

      <div class="stat">
        <small>Sales</small>
        <strong id="statSales">₦0</strong>
      </div>

    </section>

    <!-- PRODUCTS -->

    <section class="panel">

      <div class="panelHead">

        <h2>Products</h2>

        <button class="primary" onclick="openProductModal()">
          + Add Product
        </button>

      </div>

      <input
        id="productSearch"
        class="search"
        placeholder="Search products..."
        oninput="renderProducts()"
      >

      <div id="products" class="products">
        <div class="empty">Loading...</div>
      </div>

    </section>

    <!-- ORDERS -->

    <section class="panel">

      <div class="panelHead">

        <h2>Customer Orders</h2>

      </div>

      <input
        id="orderSearch"
        class="search"
        placeholder="Search customer or order..."
        oninput="renderOrders()"
      >

      <div id="orders">
        <div class="empty">Loading orders...</div>
      </div>

    </section>

  </main>

  <button class="bottomAdd" onclick="openProductModal()">+</button>

</section>

<!-- OVERLAY -->

<div id="overlay" class="overlay" onclick="closeProductModal()"></div>

<!-- PRODUCT MODAL -->

<div id="productModal" class="modal">

  <div class="modalHead">

    <h2 id="modalTitle">Add Product</h2>

    <button class="close" onclick="closeProductModal()">×</button>

  </div>

  <form id="productForm" class="form">

    <input id="productName" placeholder="Product name" required>

    <select id="productCategory" required>
      <option value="">Choose category</option>
      <option>Clothing</option>
      <option>Perfumes</option>
      <option>Bags</option>
      <option>Shoes</option>
      <option>Jewelry</option>
      <option>Watches</option>
      <option>Accessories</option>
    </select>

    <input
      id="productPrice"
      type="number"
      placeholder="Price ₦"
      min="0"
      required
    >

    <input
      id="productStock"
      type="number"
      placeholder="Stock quantity"
      min="0"
      required
    >

    <textarea
      id="productDescription"
      rows="3"
      placeholder="Product description"
    ></textarea>

    <input
      id="productImage"
      type="file"
      accept="image/*"
    >

    <img id="imagePreview" class="preview">

    <button class="primary" id="saveProductBtn">
      Save Product
    </button>

  </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot,
  query,
  where,
  getDocs,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLx6RK5sRIduaKiDSTAlgkFUH7iDSBM",
  authDomain: "shop-3d56c.firebaseapp.com",
  projectId: "shop-3d56c",
  storageBucket: "shop-3d56c.firebasestorage.app",
  messagingSenderId: "285039032126",
  appId: "1:285039032126:web:c2226d1aeb02a555c35e6f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let products=[];
let orders=[];
let editingProductId=null;
let editingImage="";
let adminReady=false;

const money=n=>"₦"+Number(n||0).toLocaleString();

function notice(message,type=""){
  const el=document.getElementById("notice");

  el.textContent=message;
  el.className="notice show "+type;

  setTimeout(()=>{
    el.className="notice";
  },3500);
}

document.getElementById("loginForm").addEventListener("submit",async e=>{

  e.preventDefault();

  const email=document.getElementById("adminEmail").value.trim();
  const password=document.getElementById("adminPassword").value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    notice(
      "Invalid admin email or password.",
      "error"
    );
  }
});

onAuthStateChanged(auth,async user=>{

  if(!user){
    adminReady=false;

    document.getElementById("loginScreen").style.display="grid";
    document.getElementById("adminApp").style.display="none";

    return;
  }

  try{

    /*
      SECURITY:
      Your Firebase Auth admin user's UID must have:

      admins/{UID}

      with:

      email = admin email
      role = "admin"
      active = true
    */

    const adminRef=doc(db,"admins",user.uid);

    const adminSnap=await getDocs(
      query(
        collection(db,"admins"),
        where("__name__","==",user.uid)
      )
    );

    if(adminSnap.empty){

      await signOut(auth);

      notice(
        "This account is not registered as an admin.",
        "error"
      );

      return;
    }

    const adminData=adminSnap.docs[0].data();

    if(
      adminData.role!=="admin" ||
      adminData.active!==true
    ){

      await signOut(auth);

      notice(
        "Admin access is disabled.",
        "error"
      );

      return;
    }

    adminReady=true;

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminApp").style.display="block";

    startListeners();

  }catch(error){

    console.error(error);

    await signOut(auth);

    notice(
      "Unable to verify admin account.",
      "error"
    );
  }

});

function startListeners(){

  onSnapshot(collection(db,"products"),snapshot=>{

    products=snapshot.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    renderProducts();
    updateStats();

  });

  onSnapshot(collection(db,"orders"),snapshot=>{

    orders=snapshot.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    orders.sort((a,b)=>{

      const ta=a.createdAt?.seconds||0;
      const tb=b.createdAt?.seconds||0;

      return tb-ta;
    });

    renderOrders();
    updateStats();

  });

}

function updateStats(){

  const totalStock=products.reduce(
    (sum,p)=>sum+Number(p.stock||0),
    0
  );

  const sales=orders
    .filter(o=>o.status==="confirmed" || o.status==="delivered")
    .reduce(
      (sum,o)=>sum+Number(o.total||0),
      0
    );

  document.getElementById("statProducts").textContent=
    products.length;

  document.getElementById("statStock").textContent=
    totalStock;

  document.getElementById("statOrders").textContent=
    orders.length;

  document.getElementById("statSales").textContent=
    money(sales);
}

function renderProducts(){

  const box=document.getElementById("products");

  const search=
    document.getElementById("productSearch")
      .value
      .toLowerCase();

  const list=products.filter(p=>
    String(p.name||"").toLowerCase().includes(search) ||
    String(p.category||"").toLowerCase().includes(search)
  );

  if(!list.length){

    box.innerHTML=
      `<div class="empty">No products found.</div>`;

    return;
  }

  box.innerHTML=list.map(p=>`

    <article class="product">

      ${
        p.image
        ? `<img src="${p.image}" alt="">`
        : `<div style="aspect-ratio:1;background:#f8edf2"></div>`
      }

      <div class="productBody">

        <div class="productName">
          ${escapeHtml(p.name||"Product")}
        </div>

        <div class="productMeta">
          ${escapeHtml(p.category||"")}
        </div>

        <div class="productPrice">
          ${money(p.price)}
        </div>

        <div class="productMeta">
          Stock: <strong>${Number(p.stock||0)}</strong>
        </div>

        <div class="productButtons">

          <button
            class="secondary"
            onclick="editProduct('${p.id}')">
            Edit
          </button>

          <button
            class="danger"
            onclick="deleteProduct('${p.id}')">
            Delete
          </button>

        </div>

      </div>

    </article>

  `).join("");
}

window.openProductModal=function(product=null){

  document.getElementById("overlay").classList.add("show");
  document.getElementById("productModal").classList.add("show");

  if(product){

    editingProductId=product.id;
    editingImage=product.image||"";

    document.getElementById("modalTitle").textContent=
      "Edit Product";

    document.getElementById("productName").value=
      product.name||"";

    document.getElementById("productCategory").value=
      product.category||"";

    document.getElementById("productPrice").value=
      product.price||0;

    document.getElementById("productStock").value=
      product.stock||0;

    document.getElementById("productDescription").value=
      product.description||"";

    if(editingImage){

      const preview=document.getElementById("imagePreview");

      preview.src=editingImage;
      preview.style.display="block";
    }

  }else{

    editingProductId=null;
    editingImage="";

    document.getElementById("modalTitle").textContent=
      "Add Product";

    document.getElementById("productForm").reset();

    document.getElementById("imagePreview").style.display=
      "none";
  }
};

window.closeProductModal=function(){

  document.getElementById("overlay").classList.remove("show");
  document.getElementById("productModal").classList.remove("show");

};

document.getElementById("productImage").addEventListener("change",e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=event=>{

    const preview=document.getElementById("imagePreview");

    preview.src=event.target.result;
    preview.style.display="block";

  };

  reader.readAsDataURL(file);

});

document.getElementById("productForm").addEventListener("submit",async e=>{

  e.preventDefault();

  const button=document.getElementById("saveProductBtn");

  button.disabled=true;
  button.textContent="Saving...";

  try{

    let image=editingImage;

    const file=document.getElementById("productImage").files[0];

    if(file){

      image=await fileToBase64(file);
    }

    const data={

      name:document.getElementById("productName").value.trim(),

      category:
        document.getElementById("productCategory").value,

      price:Number(
        document.getElementById("productPrice").value
      ),

      stock:Number(
        document.getElementById("productStock").value
      ),

      description:
        document.getElementById("productDescription").value.trim(),

      image:image||"",

      updatedAt:serverTimestamp()

    };

    if(editingProductId){

      await updateDoc(
        doc(db,"products",editingProductId),
        data
      );

      notice(
        "Product updated successfully.",
        "success"
      );

    }else{

      await addDoc(
        collection(db,"products"),
        {
          ...data,
          createdAt:serverTimestamp()
        }
      );

      notice(
        "Product added successfully 🎉",
        "success"
      );
    }

    closeProductModal();

  }catch(error){

    console.error(error);

    notice(
      "Could not save product.",
      "error"
    );

  }finally{

    button.disabled=false;
    button.textContent="Save Product";

  }

});

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}

window.editProduct=function(id){

  const product=products.find(p=>p.id===id);

  if(product){
    openProductModal(product);
  }

};

window.deleteProduct=async function(id){

  const product=products.find(p=>p.id===id);

  if(!product)return;

  if(!confirm(
    `Delete "${product.name}"?`
  ))return;

  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    notice(
      "Product deleted.",
      "success"
    );

  }catch(error){

    console.error(error);

    notice(
      "Could not delete product.",
      "error"
    );
  }

};

function renderOrders(){

  const box=document.getElementById("orders");

  const search=
    document.getElementById("orderSearch")
      .value
      .toLowerCase();

  const list=orders.filter(order=>{

    const name=
      String(order.customer?.name||"").toLowerCase();

    const phone=
      String(order.customer?.phone||"").toLowerCase();

    const id=
      String(order.id||"").toLowerCase();

    return(
      name.includes(search) ||
      phone.includes(search) ||
      id.includes(search)
    );

  });

  if(!list.length){

    box.innerHTML=
      `<div class="empty">No orders found.</div>`;

    return;
  }

  box.innerHTML=list.map(order=>{

    const status=order.status||"pending";

    const date=order.createdAt?.toDate
      ? order.createdAt.toDate().toLocaleString()
      : "Just now";

    const customer=order.customer||{};

    const items=(order.items||[]).map(item=>`

      <div class="orderItem">

        <span>
          ${escapeHtml(item.name||"Product")}
          × ${item.quantity}
        </span>

        <strong>
          ${money(
            Number(item.price||0)*
            Number(item.quantity||0)
          )}
        </strong>

      </div>

    `).join("");

    return `

      <article class="order">

        <div class="orderHeader">

          <div>

            <strong>
              Order #${order.id.slice(0,8)}
            </strong>

            <div style="font-size:11px;color:#82747c;margin-top:4px">
              ${date}
            </div>

          </div>

          <span class="status ${status}">
            ${status}
          </span>

        </div>

        <div class="customer">

          <strong>Customer</strong>

          <div>
            Name: ${escapeHtml(customer.name||"")}
          </div>

          <div>
            Phone: ${escapeHtml(customer.phone||"")}
          </div>

          <div>
            Address: ${escapeHtml(customer.address||"")}
          </div>

          ${
            customer.note
            ? `<div>Note: ${escapeHtml(customer.note)}</div>`
            :""
          }

        </div>

        <div class="orderItems">

          ${items}

        </div>

        <div class="orderTotal">
          Total: ${money(order.total)}
        </div>

        ${
          status==="pending"
          ? `
            <div class="orderActions">

              <button
                class="confirm"
                onclick="changeOrderStatus('${order.id}','confirmed')">
                ✓ Confirm Order
              </button>

              <button
                class="cancel"
                onclick="changeOrderStatus('${order.id}','cancelled')">
                Cancel
              </button>

            </div>
          `
          :""
        }

        ${
          status==="confirmed"
          ? `
            <div class="orderActions">

              <button
                class="deliver"
                onclick="changeOrderStatus('${order.id}','delivered')">
                ✓ Mark Delivered
              </button>

              <button
                class="cancel"
                onclick="changeOrderStatus('${order.id}','cancelled')">
                Cancel
              </button>

            </div>
          `
          :""
        }

      </article>

    `;

  }).join("");
}

window.changeOrderStatus=async function(orderId,newStatus){

  const order=orders.find(o=>o.id===orderId);

  if(!order)return;

  if(
    newStatus==="cancelled" &&
    !confirm(
      "Cancel this order and return the items to stock?"
    )
  ){
    return;
  }

  try{

    const orderRef=doc(db,"orders",orderId);

    await runTransaction(db,async transaction=>{

      const orderSnap=await transaction.get(orderRef);

      if(!orderSnap.exists()){
        throw new Error("Order no longer exists.");
      }

      const current=orderSnap.data();

      if(
        current.status==="cancelled" ||
        current.status==="delivered"
      ){
        throw new Error(
          "This order can no longer be changed."
        );
      }

      /*
        If cancelling an order whose stock was reserved,
        restore each product quantity.
      */

      if(
        newStatus==="cancelled" &&
        current.stockReserved===true
      ){

        for(const item of current.items||[]){

          const productRef=
            doc(db,"products",item.productId);

          const productSnap=
            await transaction.get(productRef);

          if(productSnap.exists()){

            const productData=
              productSnap.data();

            const oldStock=
              Number(productData.stock||0);

            transaction.update(
              productRef,
              {
                stock:
                  oldStock+
                  Number(item.quantity||0),

                updatedAt:
                  serverTimestamp()
              }
            );
          }
        }

        transaction.update(
          orderRef,
          {
            status:"cancelled",
            stockReserved:false,
            updatedAt:serverTimestamp()
          }
        );

      }else{

        transaction.update(
          orderRef,
          {
            status:newStatus,
            updatedAt:serverTimestamp()
          }
        );
      }

    });

    notice(
      newStatus==="confirmed"
        ? "Order confirmed ✅"
        : newStatus==="delivered"
          ? "Order marked as delivered 🎉"
          : "Order cancelled and stock restored.",
      "success"
    );

  }catch(error){

    console.error(error);

    notice(
      error.message||"Could not update order.",
      "error"
    );

  }

};

  await signOut(auth);

};

window.enableNotifications=function(){

  notice(
    "Push notifications require the Firebase messaging setup already added to your project.",
    "success"
  );

};

function escapeHtml(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
