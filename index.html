<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>LuxeStore — Fashion & Beauty</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --pink:#f7a8c4;
  --deep:#3c1628;
  --cream:#fff8f5;
  --white:#fff;
  --text:#2b2025;
  --muted:#8d7d84;
  --line:#f0dfe5;
  --shadow:0 15px 45px rgba(92,42,62,.10);
}

body{
  font-family:"DM Sans",sans-serif;
  background:var(--cream);
  color:var(--text);
}

button,input{font:inherit}

button{cursor:pointer}

svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,248,245,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1200px;
  margin:auto;
  height:72px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:27px;
  color:var(--deep);
  font-weight:700;
}

.logo span{color:var(--pink)}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:43px;
  height:43px;
  border:1px solid var(--line);
  background:white;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--deep);
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  padding:40px 18px 20px;
}

.hero-box{
  position:relative;
  overflow:hidden;
  min-height:390px;
  border-radius:32px;
  background:linear-gradient(135deg,#ffe8f0,#fff4ef);
  padding:45px 28px;
  display:flex;
  align-items:center;
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:570px;
}

.eyebrow{
  color:#b65a7d;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  font-size:12px;
  margin-bottom:12px;
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(42px,8vw,75px);
  line-height:.98;
  color:var(--deep);
  margin-bottom:20px;
}

.hero p{
  color:#745e67;
  max-width:480px;
  line-height:1.7;
  margin-bottom:25px;
}

.shop-btn{
  border:0;
  background:var(--deep);
  color:white;
  padding:15px 23px;
  border-radius:30px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}

.hero-circle{
  position:absolute;
  border-radius:50%;
  filter:blur(1px);
}

.circle1{
  width:300px;
  height:300px;
  background:#f7b7cc;
  right:-60px;
  top:-80px;
}

.circle2{
  width:220px;
  height:220px;
  background:#fff;
  right:120px;
  bottom:-100px;
}

.floating-flower{
  position:absolute;
  right:35px;
  top:35px;
  width:95px;
  height:95px;
  color:#b65a7d;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-12px) rotate(5deg)}
}

/* CATEGORIES */

.section{
  max-width:1200px;
  margin:auto;
  padding:35px 18px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px;
}

.section-title h2{
  font-family:"Playfair Display",serif;
  color:var(--deep);
  font-size:30px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
}

.categories::-webkit-scrollbar{display:none}

.category{
  white-space:nowrap;
  padding:11px 18px;
  border-radius:30px;
  border:1px solid var(--line);
  background:white;
  color:#654d58;
}

.category.active{
  background:var(--deep);
  color:white;
  border-color:var(--deep);
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
}

.product-image{
  height:245px;
  background:#f8e9ee;
  position:relative;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stock-badge{
  position:absolute;
  top:12px;
  left:12px;
  padding:7px 10px;
  border-radius:20px;
  background:white;
  font-size:11px;
  font-weight:800;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.stock-badge.low{
  color:#b54855;
}

.stock-badge.sold{
  color:white;
  background:#6c5860;
}

.product-body{
  padding:16px;
}

.product-category{
  font-size:11px;
  color:#ad7289;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
}

.product-name{
  margin:7px 0;
  font-weight:700;
  color:var(--deep);
  font-size:17px;
}

.product-description{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  min-height:38px;
}

.product-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:15px;
}

.price{
  font-weight:800;
  color:var(--deep);
}

.add-btn{
  border:0;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--deep);
  color:white;
  display:grid;
  place-items:center;
}

.add-btn:disabled{
  background:#ddd;
  color:#999;
  cursor:not-allowed;
}

/* LOADING */

.loading{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

/* FLOATING UI */

.floating-cart{
  position:fixed;
  right:18px;
  bottom:90px;
  z-index:200;
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:var(--deep);
  color:white;
  box-shadow:0 12px 30px rgba(60,22,40,.25);
  display:grid;
  place-items:center;
}

.cart-count{
  position:absolute;
  right:-3px;
  top:-4px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  background:#ef6d98;
  border:2px solid white;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  display:grid;
  place-items:center;
}

.whatsapp{
  position:fixed;
  left:18px;
  bottom:25px;
  z-index:200;
  width:54px;
  height:54px;
  border-radius:50%;
  background:#25d366;
  color:white;
  display:grid;
  place-items:center;
  box-shadow:0 10px 25px rgba(37,211,102,.25);
}

.floating-label{
  position:fixed;
  right:18px;
  bottom:160px;
  z-index:190;
  background:white;
  color:var(--deep);
  border:1px solid var(--line);
  padding:9px 13px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  box-shadow:var(--shadow);
  animation:float 4s ease-in-out infinite;
}

/* CART */

.cart-panel{
  position:fixed;
  right:0;
  top:0;
  width:min(420px,100%);
  height:100%;
  background:white;
  z-index:500;
  transform:translateX(100%);
  transition:.3s ease;
  box-shadow:-15px 0 45px rgba(0,0,0,.12);
  display:flex;
  flex-direction:column;
}

.cart-panel.open{
  transform:translateX(0);
}

.cart-head{
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.cart-head h3{
  font-family:"Playfair Display",serif;
  font-size:25px;
  color:var(--deep);
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:18px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:14px;
}

.cart-item-info{flex:1}

.cart-item-name{
  font-weight:700;
  color:var(--deep);
  font-size:14px;
}

.cart-item-price{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  border:1px solid var(--line);
  background:white;
  width:25px;
  height:25px;
  border-radius:50%;
}

.cart-foot{
  padding:20px;
  border-top:1px solid var(--line);
}

.total{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-weight:800;
  color:var(--deep);
}

.checkout{
  width:100%;
  border:0;
  padding:15px;
  background:var(--deep);
  color:white;
  border-radius:15px;
  font-weight:800;
}

/* MOBILE */

@media(max-width:850px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .product-image{
    height:210px;
  }
}

@media(max-width:520px){
  .nav{height:64px}

  .logo{font-size:23px}

  .hero{
    padding-top:20px;
  }

  .hero-box{
    min-height:430px;
    padding:35px 23px;
  }

  .hero h1{
    font-size:46px;
  }

  .hero p{
    font-size:14px;
  }

  .products{
    gap:11px;
  }

  .product{
    border-radius:17px;
  }

  .product-image{
    height:185px;
  }

  .product-body{
    padding:12px;
  }

  .product-name{
    font-size:14px;
  }

  .product-description{
    font-size:11px;
  }

  .price{
    font-size:13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Luxe<span>Store</span></div>

    <div class="nav-actions">
      <button class="icon-btn" onclick="scrollToProducts()" aria-label="Shop">
        <svg viewBox="0 0 24 24">
          <circle cx="9" cy="20" r="1"></circle>
          <circle cx="18" cy="20" r="1"></circle>
          <path d="M3 4h2l2.5 11h10L20 7H6"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<main>

<section class="hero">
  <div class="hero-box">

    <div class="hero-circle circle1"></div>
    <div class="hero-circle circle2"></div>

    <svg class="floating-flower" viewBox="0 0 100 100">
      <path d="M50 50c-22-8-30-24-18-34 9-7 20 1 18 17 2-16 14-24 23-17 12 10 4 26-18 34 22-8 38-1 35 12-3 12-18 12-35-4 17 16 17 31 5 35-13 4-20-12-15-35-5 23-18 39-29 34-12-5-8-20 9-34-17 14-32 14-35 2-3-13 13-20 35-12z"></path>
      <circle cx="50" cy="50" r="5"></circle>
    </svg>

    <div class="hero-content">
      <div class="eyebrow">Curated for her</div>
      <h1>Elegance<br>in every detail.</h1>
      <p>
        Discover beautiful fashion, perfumes, bags, shoes,
        jewelry and accessories made to elevate your everyday style.
      </p>

      <button class="shop-btn" onclick="scrollToProducts()">
        Shop collection
        <svg viewBox="0 0 24 24">
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </button>
    </div>
  </div>
</section>

<section class="section" id="shop">

  <div class="section-title">
    <h2>Shop collection</h2>
  </div>

  <div class="categories">
    <button class="category active" onclick="filterCategory('All',this)">All</button>
    <button class="category" onclick="filterCategory('Clothing',this)">Clothing</button>
    <button class="category" onclick="filterCategory('Perfumes',this)">Perfumes</button>
    <button class="category" onclick="filterCategory('Bags',this)">Bags</button>
    <button class="category" onclick="filterCategory('Shoes',this)">Shoes</button>
    <button class="category" onclick="filterCategory('Jewelry',this)">Jewelry</button>
    <button class="category" onclick="filterCategory('Watches',this)">Watches</button>
    <button class="category" onclick="filterCategory('Accessories',this)">Accessories</button>
  </div>

  <div id="products" class="products">
    <div class="loading">Loading collection...</div>
  </div>

</section>

</main>

<!-- FLOATING UI -->

<div class="floating-label">✨ New arrivals</div>

<button class="floating-cart" onclick="openCart()" aria-label="Cart">
  <svg viewBox="0 0 24 24">
    <circle cx="9" cy="20" r="1"></circle>
    <circle cx="18" cy="20" r="1"></circle>
    <path d="M3 4h2l2.5 11h10L20 7H6"></path>
  </svg>
  <span class="cart-count" id="cartCount">0</span>
</button>

<a class="whatsapp"
   href="https://wa.me/2340000000000?text=Hello%20LuxeStore%20%F0%9F%8C%B8"
   aria-label="WhatsApp">
  <svg viewBox="0 0 24 24">
    <path d="M20 11.5a8.5 8.5 0 0 1-12.7 7.4L3 20l1.2-4.1A8.5 8.5 0 1 1 20 11.5z"></path>
    <path d="M8.5 8.5c.4 2.4 2.1 4.6 4.5 5.5"></path>
  </svg>
</a>

<!-- CART -->

<div class="cart-panel" id="cartPanel">

  <div class="cart-head">
    <h3>Your bag</h3>

    <button class="icon-btn" onclick="closeCart()">
      <svg viewBox="0 0 24 24">
        <path d="m6 6 12 12"></path>
        <path d="m18 6-12 12"></path>
      </svg>
    </button>
  </div>

  <div class="cart-items" id="cartItems">
    <p style="color:#999;text-align:center;padding:30px">
      Your bag is empty.
    </p>
  </div>

  <div class="cart-foot">

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">₦0</span>
    </div>

    <button class="checkout" onclick="checkout()">
      Checkout on WhatsApp
    </button>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLx6RK5sRIduaKiDSTAGlKPmfUH7iDSBM",
  authDomain: "shop-3d56c.firebaseapp.com",
  projectId: "shop-3d56c",
  storageBucket: "shop-3d56c.firebasestorage.app",
  messagingSenderId: "285039032126",
  appId: "1:285039032126:web:c2226d1aeb02a555c35e6f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = [];
let currentCategory = "All";

function money(value){
  return "₦" + Number(value || 0).toLocaleString();
}

function stockLabel(stock){

  stock = Number(stock || 0);

  if(stock <= 0){
    return {
      text:"Sold out",
      className:"sold"
    };
  }

  if(stock === 1){
    return {
      text:"⚡ Last one",
      className:"low"
    };
  }

  if(stock <= 3){
    return {
      text:`🔥 Only ${stock} left`,
      className:"low"
    };
  }

  if(stock <= 5){
    return {
      text:`Only ${stock} left`,
      className:"low"
    };
  }

  return {
    text:`${stock} left`,
    className:""
  };
}

function renderProducts(){

  const container = document.getElementById("products");

  let list = products;

  if(currentCategory !== "All"){
    list = products.filter(
      p => String(p.category || "").toLowerCase() === currentCategory.toLowerCase()
    );
  }

  if(!list.length){
    container.innerHTML = `
      <div class="loading" style="grid-column:1/-1">
        No products available in this category yet.
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(p => {

    const stock = Number(p.stock || 0);
    const badge = stockLabel(stock);

    return `
      <article class="product">

        <div class="product-image">

          <img
            src="${p.image || 'https://placehold.co/600x700/f8e9ee/6c4657?text=LuxeStore'}"
            alt="${escapeHtml(p.name || 'Product')}"
          >

          <div class="stock-badge ${badge.className}">
            ${badge.text}
          </div>

        </div>

        <div class="product-body">

          <div class="product-category">
            ${escapeHtml(p.category || "Collection")}
          </div>

          <div class="product-name">
            ${escapeHtml(p.name || "Untitled product")}
          </div>

          <div class="product-description">
            ${escapeHtml(p.description || "Beautifully selected for you.")}
          </div>

          <div class="product-bottom">

            <div class="price">
              ${money(p.price)}
            </div>

            <button
              class="add-btn"
              ${stock <= 0 ? "disabled" : ""}
              onclick="addToCart('${p.id}')"
              aria-label="Add to cart"
            >
              <svg viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </button>

          </div>

        </div>

      </article>
    `;

  }).join("");
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

onSnapshot(
  collection(db,"products"),
  snapshot => {

    products = snapshot.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    renderProducts();
    renderCart();

  },
  error => {

    console.error(error);

    document.getElementById("products").innerHTML = `
      <div class="loading" style="grid-column:1/-1">
        Unable to load products.<br>
        Please check your Firebase Firestore rules.
      </div>
    `;

  }
);

window.filterCategory = function(category,button){

  currentCategory = category;

  document.querySelectorAll(".category")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

};

window.addToCart = function(id){

  const product = products.find(p => p.id === id);

  if(!product) return;

  const stock = Number(product.stock || 0);

  if(stock <= 0){
    alert("This product is sold out.");
    return;
  }

  const existing = cart.find(x => x.id === id);

  if(existing){

    if(existing.quantity >= stock){
      alert(`Only ${stock} left in stock.`);
      return;
    }

    existing.quantity++;

  }else{

    cart.push({
      id,
      name:product.name,
      price:Number(product.price || 0),
      image:product.image || "",
      quantity:1
    });

  }

  renderCart();

  document.getElementById("cartPanel").classList.add("open");

};

window.changeQuantity = function(id,change){

  const item = cart.find(x => x.id === id);

  const product = products.find(x => x.id === id);

  if(!item || !product) return;

  const stock = Number(product.stock || 0);

  item.quantity += change;

  if(item.quantity > stock){
    item.quantity = stock;
    alert(`Only ${stock} left in stock.`);
  }

  if(item.quantity <= 0){
    cart = cart.filter(x => x.id !== id);
  }

  renderCart();

};

function renderCart(){

  const container = document.getElementById("cartItems");
  const count = document.getElementById("cartCount");
  const totalEl = document.getElementById("cartTotal");

  const totalQuantity = cart.reduce(
    (sum,item) => sum + item.quantity,
    0
  );

  count.textContent = totalQuantity;

  if(!cart.length){

    container.innerHTML = `
      <p style="color:#999;text-align:center;padding:30px">
        Your bag is empty.
      </p>
    `;

    totalEl.textContent = "₦0";

    return;
  }

  let total = 0;

  container.innerHTML = cart.map(item => {

    const product = products.find(p => p.id === item.id);

    if(!product) return "";

    const stock = Number(product.stock || 0);

    const itemTotal = item.price * item.quantity;

    total += itemTotal;

    return `
      <div class="cart-item">

        <img
          src="${item.image || 'https://placehold.co/100x100/f8e9ee/6c4657?text=Luxe'}"
          alt=""
        >

        <div class="cart-item-info">

          <div class="cart-item-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="cart-item-price">
            ${money(item.price)}
          </div>

          <div class="qty">

            <button onclick="changeQuantity('${item.id}',-1)">
              −
            </button>

            <strong>${item.quantity}</strong>

            <button
              onclick="changeQuantity('${item.id}',1)"
              ${item.quantity >= stock ? "disabled" : ""}
            >
              +
            </button>

          </div>

        </div>

      </div>
    `;

  }).join("");

  totalEl.textContent = money(total);

}

window.openCart = function(){
  document.getElementById("cartPanel").classList.add("open");
};

window.closeCart = function(){
  document.getElementById("cartPanel").classList.remove("open");
};

window.scrollToProducts = function(){
  document.getElementById("shop").scrollIntoView({
    behavior:"smooth"
  });
};

window.checkout = function(){

  if(!cart.length){
    alert("Your bag is empty.");
    return;
  }

  let message = "Hello LuxeStore 🌸%0A%0AI would like to order:%0A%0A";

  cart.forEach(item => {

    message += `• ${encodeURIComponent(item.name)} x${item.quantity} — ${encodeURIComponent(money(item.price * item.quantity))}%0A`;

  });

  const total = cart.reduce(
    (sum,item) => sum + item.price * item.quantity,
    0
  );

  message += `%0ATotal: ${encodeURIComponent(money(total))}%0A%0A`;
  message += "Please confirm availability and delivery details.";

  window.open(
    `https://wa.me/2340000000000?text=${message}`,
    "_blank"
  );

};

</script>

</body>
</html>
